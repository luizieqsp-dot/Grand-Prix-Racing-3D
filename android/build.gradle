
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.grandprix.racing'
    compileSdk 35

    defaultConfig {
        applicationId 'com.grandprix.racing'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')

    implementation "com.badlogicgames.gdx:gdx-backend-android:${rootProject.ext.gdxVersion}"

    implementation "com.badlogicgames.gdx:gdx-platform:${rootProject.ext.gdxVersion}:natives-arm64-v8a"
}
