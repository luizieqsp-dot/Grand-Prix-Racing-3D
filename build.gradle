
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

ext {
    gdxVersion = '1.14.2'
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
